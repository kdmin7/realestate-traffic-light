    :root {
      --bg-main: #0b0f17;
      --card-bg: #141a24;
      --card-border: #212b3b;
      --card-hover: #1b2433;
      --text-title: #f8fafc;
      --text-sub: #94a3b8;
      --text-muted: #64748b;
      
      --signal-green: #22c55e;
      --signal-green-bg: rgba(34, 197, 94, 0.12);
      --signal-yellow: #eab308;
      --signal-yellow-bg: rgba(234, 179, 8, 0.12);
      --signal-red: #ef4444;
      --signal-red-bg: rgba(239, 68, 68, 0.12);
      --accent-blue: #38bdf8;
      --accent-purple: #a855f7;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-main);
      color: var(--text-title);
      font-family: 'Noto Sans KR', 'Inter', -apple-system, sans-serif;
      min-height: 100vh;
      padding: 24px;
      line-height: 1.5;
    }

    .container {
      max-width: 1840px;
      margin: 0 auto;
    }

    /* Main Header */
    header {
      background: linear-gradient(135deg, #141a24 0%, #1e2736 100%);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 28px 36px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .lights-badge {
      display: flex;
      gap: 8px;
      background: #090c12;
      padding: 10px 16px;
      border-radius: 24px;
      border: 1px solid #2a3547;
    }

    .dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
    }
    .dot.green { background: var(--signal-green); box-shadow: 0 0 12px var(--signal-green); }
    .dot.yellow { background: var(--signal-yellow); box-shadow: 0 0 12px var(--signal-yellow); }
    .dot.red { background: var(--signal-red); box-shadow: 0 0 12px var(--signal-red); }

    .header-title h1 {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: -0.5px;
      background: linear-gradient(90deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-title p {
      font-size: 13px;
      color: var(--text-sub);
      margin-top: 2px;
    }

    .header-summary {
      display: flex;
      gap: 16px;
    }

    .kpi-card {
      background: #090c12;
      border: 1px solid var(--card-border);
      padding: 12px 20px;
      border-radius: 12px;
      text-align: center;
    }

    .kpi-card .label { font-size: 11px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; }
    .kpi-card .val { font-size: 18px; font-weight: 800; font-family: 'JetBrains Mono', monospace; margin-top: 2px; }
    .kpi-card .val.green { color: var(--signal-green); }
    .kpi-card .val.yellow { color: var(--signal-yellow); }
    .kpi-card .val.red { color: var(--signal-red); }
    .kpi-card .val.blue { color: var(--accent-blue); }

    /* Filter Bar */
    .filter-bar {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px 24px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .filter-tabs {
      display: flex;
      gap: 8px;
    }

    .tab-btn {
      background: #090c12;
      border: 1px solid var(--card-border);
      color: var(--text-sub);
      font-size: 13px;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn:hover, .tab-btn.active {
      background: #2a3547;
      color: #fff;
      border-color: var(--accent-blue);
    }

    .search-input {
      background: #090c12;
      border: 1px solid var(--card-border);
      color: #fff;
      font-size: 13px;
      padding: 8px 16px;
      border-radius: 10px;
      width: 260px;
      outline: none;
    }

    .search-input:focus { border-color: var(--accent-blue); }

    /* 25 Districts Grid (5 columns per row on 1920x1080) */
    .districts-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 18px;
      margin-bottom: 36px;
    }

    .d-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
    }

    .d-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
    }

    .d-card.sig-green::before { background: var(--signal-green); }
    .d-card.sig-yellow::before { background: var(--signal-yellow); }
    .d-card.sig-red::before { background: var(--signal-red); }

    .d-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
      border-color: #38bdf8;
    }

    .d-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .d-name-box {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .d-name-box h3 {
      font-size: 18px;
      font-weight: 800;
    }

    .d-name-box .slug {
      font-size: 12px;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
    }

    .sig-badge {
      font-size: 11px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .sig-green .sig-badge { background: var(--signal-green-bg); color: var(--signal-green); border: 1px solid rgba(34, 197, 94, 0.3); }
    .sig-yellow .sig-badge { background: var(--signal-yellow-bg); color: var(--signal-yellow); border: 1px solid rgba(234, 179, 8, 0.3); }
    .sig-red .sig-badge { background: var(--signal-red-bg); color: var(--signal-red); border: 1px solid rgba(239, 68, 68, 0.3); }

    .d-card-body {
      margin-bottom: 16px;
    }

    .metric-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      margin-bottom: 6px;
    }

    .metric-label { color: var(--text-sub); }
    .metric-val { font-family: 'JetBrains Mono', monospace; font-weight: 600; color: #e2e8f0; }

    .sim-box {
      background: #090c12;
      border: 1px solid #1e2736;
      border-radius: 10px;
      padding: 10px 12px;
      margin-top: 10px;
    }

    .sim-header {
      font-size: 11px;
      color: var(--accent-blue);
      font-weight: 700;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;

    .sim-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      font-size: 11px;

    .sim-item .lbl { color: var(--text-muted); font-size: 10px; }
    .sim-item .num { font-weight: 700; color: #f1f5f9; font-family: 'JetBrains Mono', monospace; }

      justify-content: space-between;

      z-index: 1000;
      justify-content: center;
      align-items: center;

    .m-header {

      gap: 12px;

      margin-top: 8px;
      font-size: 13px;
    }

    .m-table th, .m-table td {
      border: 1px solid #212b3b;
      padding: 8px 12px;
      text-align: left;
    }

      { name: "강북구", slug: "gangbuk", sig: "red", sigText: "🔴 관망", score: 44, price: "3,850만", jeonse: "62.50%", school: "6점", highApt: "미아래미안트리베라 (9.2억)", ltv50: "월 120만", roi3y: "+11.5%", bep: "5년 4개월" },
      { name: "도봉구", slug: "dobong", sig: "red", sigText: "🔴 관망", score: 43, price: "3,650만", jeonse: "63.10%", school: "7점", highApt: "창동주공19단지 (7.2억)", ltv50: "월 110만", roi3y: "+13.0%", bep: "5년 1개월" },
      { name: "금천구", slug: "geumcheon", sig: "red", sigText: "🔴 관망", score: 45, price: "3,750만", jeonse: "60.50%", school: "5점", highApt: "롯데캐슬골드파크1차 (10.8억)", ltv50: "월 130만", roi3y: "+12.5%", bep: "5년 3개월" }
    ];

    function renderCards(list) {
      const grid = document.getElementById('districtsGrid');
      grid.innerHTML = list.map(d => `
        <div class="d-card sig-${d.sig}">
          <div class="d-card-header">
            <div class="d-name-box">
              <h3>${d.name}</h3>
              <span class="slug">${d.slug}</span>
            </div>
            <div class="sig-badge">${d.sigText}</div>
          </div>
          
          <div class="d-card-body">
            <div class="metric-row">
              <span class="metric-label">평균 평당가</span>
              <span class="metric-val">${d.price}</span>
            </div>
            <div class="metric-row">
              <span class="metric-label">평균 전세가율</span>
              <span class="metric-val">${d.jeonse}</span>
            </div>
            <div class="metric-row">
              <span class="metric-label">학군 지수 (NEIS)</span>
              <span class="metric-val">${d.school}</span>
            </div>
            <div class="metric-row">
              <span class="metric-label">트렌드 스코어</span>
              <span class="metric-val" style="color:var(--accent-blue);">${d.score}점</span>
            </div>

            <div class="sim-box">
              <div class="sim-header">
                <span>금융 시뮬레이터</span>
                <span>LTV 50%</span>
              </div>
              <div class="sim-grid">
                <div class="sim-item">
                  <div class="lbl">월 이자 감당</div>
                  <div class="num">${d.ltv50}</div>
                </div>
                <div class="sim-item">
                  <div class="lbl">3년 기대 ROI</div>
                  <div class="num" style="color:var(--signal-green);">${d.roi3y}</div>
                </div>
              </div>
            </div>
          </div>

          <div class="d-card-footer">
            <span class="file-tag">${d.slug}_raw_2026W33.md</span>
            <button class="btn-detail-sm" onclick="openDetail('${d.slug}')">3초 리포트</button>
          </div>
        </div>
      `).join('');
    }

    function filterDistricts(type) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      if (type === 'all') renderCards(districtsData);
      else renderCards(districtsData.filter(d => d.sig === type));
    }

    function searchDistricts() {
      const q = document.getElementById('searchInput').value.trim().toLowerCase();
      renderCards(districtsData.filter(d => d.name.toLowerCase().includes(q) || d.slug.toLowerCase().includes(q)));
    }

    function openDetail(slug) {
      const d = districtsData.find(x => x.slug === slug);
      if (!d) return;
      document.getElementById('modalSigBadge').innerText = d.sigText;
      document.getElementById('modalSigBadge').className = `sig-badge sig-${d.sig}`;
      document.getElementById('modalGuName').innerText = `${d.name} (${d.slug})`;
      document.getElementById('modalSub').innerText = `2026년 33주차 1차 API 기반 3초 PB 브리핑 & 금융 리포트`;

      document.getElementById('modalBody').innerHTML = `
        <div class="m-section">
          <div class="m-section-title">1. 3초 핵심 판정 결론</div>
          <p><b>${d.name}</b>의 2026년 33주차 매수 타이밍 신호는 <b>${d.sigText}</b> 입니다. (트렌드 스코어: <b>${d.score}점</b>, 전세가율: <b>${d.jeonse}</b>, 주요 단지: ${d.highApt})</p>
        </div>

        <div class="m-section">
          <div class="m-section-title">2. 3대 1차 API 수집 팩트 매트릭스</div>
          <table class="m-table">
            <tr><th>지표 항목</th><th>수치 및 내용</th><th>데이터 소스</th></tr>
            <tr><td>한국은행 기준금리</td><td>연 2.75% (0.25%p 인상)</td><td>한국은행 ECOS API</td></tr>
            <tr><td>주택담보대출 금리</td><td>고정형 연 4.30% / 변동형 연 4.38%</td><td>한국은행 ECOS API</td></tr>
            <tr><td>학군 지수 (NEIS)</td><td>${d.school}</td><td>나이스 NEIS API (3개월 캐시)</td></tr>
            <tr><td>평균 평당가</td><td>${d.price}</td><td>국토교통부 실거래가 API</td></tr>
            <tr><td>평균 전세가율</td><td>${d.jeonse}</td><td>한국부동산원 / 서울시 주택정보마당</td></tr>
          </table>
        </div>

        <div class="m-section">
          <div class="m-section-title">3. 금융 수익성 & 손익분기 시뮬레이션</div>
          <table class="m-table">
            <tr><th>시나리오</th><th>월 대출 이자</th><th>3년 기대 ROI</th><th>손익분기점 (BEP)</th></tr>
            <tr><td>LTV 50% 자기자본 위주</td><td><b>${d.ltv50}</b></td><td><b style="color:var(--signal-green);">${d.roi3y}</b></td><td><b>${d.bep}</b></td></tr>
            <tr><td>LTV 70% 레버리지 최대화</td><td>월 추가 감당 필요</td><td>시장 변동성 주의</td><td>약 4년 소요</td></tr>
          </table>
        </div>

        <div class="m-section">
          <div class="m-section-title">4. 1주일 할일 (Action Plan)</div>
          <p>• ${d.name} 주요 최고가 단지 (${d.highApt}) 급매물 등록 일자 확인<br>
          • 시중은행 주담대 고정금리(4.30%) 대출 한도 사전 심사<br>
          • 전세가율 현황(${d.jeonse}) 기반 갭투자 자금 소요액 최종 검증</p>
        </div>
      `;

      document.getElementById('detailModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('detailModal').classList.remove('active');
    }

    // Initial Render
    renderCards(districtsData);
  </script>
</body>
</html>
